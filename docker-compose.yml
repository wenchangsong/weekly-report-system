version: '3.8'
services:
  app:
    build: .
    ports:
      - "3001:3001"
    volumes:
      - weekly-data:/data
    environment:
      - NODE_ENV=development
      - DB_PATH=/data/weekly.db
      - JWT_SECRET=change-me-in-production
      - PORT=3001
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - REMINDER_FROM_EMAIL=noreply@weeklyreport.app

volumes:
  weekly-data:
